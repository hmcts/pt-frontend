sonar.projectName=pt :: frontend
sonar.projectKey=pt-frontend
sonar.language=typescript
sonar.sources=src/main
sonar.tests=src/test
sonar.test.exclusions=test/coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# landlord-response/task-list mirrors application/task-list and was marked as duplication but this is likely to diverge in the future as the landlord response journey is different to the application journey. Therefore it was excluded from duplication detection to avoid false positives.
sonar.exclusions=src/main/app.ts,src/main/development.ts,src/main/index.js,src/main/server.ts,src/main/**/*.interface.ts,src/main/steps/landlord-response/task-list/index.ts
# These rent pages share most of their config with each other, one createFormStep per page like the rest of the journey. Moving them into the-rent made Sonar count that existing duplication as new code, so they are excluded from duplication detection only and coverage still applies.
sonar.cpd.exclusions=src/main/steps/application/the-rent/council-tax-frequency/index.ts,src/main/steps/application/the-rent/utilities-paid-frequency/index.ts,src/main/steps/application/the-rent/other-household-management-charges/index.ts,src/main/steps/application/the-rent/rent-inclusive-of-utility-charges/index.ts